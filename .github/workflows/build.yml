name: Build image

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      kernel:
        description: 'Kernel version(s) to build'
        required: true
        type: choice
        default: 'both'
        options:
          - '3.4'
          - '4.4'
          - both
      profile:
        description: 'Feature profile(s) to build'
        required: true
        type: choice
        default: 'both'
        options:
          - full
          - lite
          - both
      boards:
        description: 'Space-separated board names (e.g., K2P MI-R3P)'
        required: true
        type: string
        default: 'K2P MI-R3P'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          KERNELS_DEFAULT=("3.4" "4.4")
          PROFILES_DEFAULT=("full" "lite")
          BOARDS_DEFAULT=("K2P" "MI-R3P")

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            KERNEL_INPUT="${{ github.event.inputs.kernel }}"
            PROFILE_INPUT="${{ github.event.inputs.profile }}"
            read -ra BOARDS_ARRAY <<< "${{ github.event.inputs.boards }}"
          else
            KERNEL_INPUT="both"
            PROFILE_INPUT="both"
            BOARDS_ARRAY=("${BOARDS_DEFAULT[@]}")
          fi

          case "$KERNEL_INPUT" in
            3.4) KERNELS=("3.4") ;;
            4.4) KERNELS=("4.4") ;;
            both) KERNELS=("3.4" "4.4") ;;
            *) echo "Invalid kernel"; exit 1 ;;
          esac

          case "$PROFILE_INPUT" in
            full) PROFILES=("full") ;;
            lite) PROFILES=("lite") ;;
            both) PROFILES=("full" "lite") ;;
            *) echo "Invalid profile"; exit 1 ;;
          esac

          MATRIX_JSON="["
          for kernel in "${KERNELS[@]}"; do
            for profile in "${PROFILES[@]}"; do
              for board in "${BOARDS_ARRAY[@]}"; do
                MATRIX_JSON+="{\"kernel\":\"$kernel\",\"profile\":\"$profile\",\"board\":\"$board\"},"
              done
            done
          done
          MATRIX_JSON="${MATRIX_JSON%,}"
          MATRIX_JSON+="]"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: setup
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false

    env:
      KERNEL: ${{ matrix.kernel }}
      PROFILE: ${{ matrix.profile }}
      BOARD: ${{ matrix.board }}

    steps:
      - name: Checkout repository (for config files)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Set up build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
            pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source code
        env:
          PAT: ${{ secrets.PDVNPAT }}
        run: |
          if [ "$KERNEL" = "4.4" ]; then
            REPO_BASE="hdfla/padavan-ng"
          else
            REPO_BASE="hanwckf/rt-n56u"
          fi
          if [ -n "$PAT" ]; then
            CLONE_URL="https://x-access-token:${PAT}@github.com/${REPO_BASE}.git"
          else
            CLONE_URL="https://github.com/${REPO_BASE}.git"
          fi
          git clone --depth=1 "$CLONE_URL" /opt/rt-n56u
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh
          mkdir -p /opt/images/

      - name: Prepare and apply configuration
        run: |
          cd /opt/rt-n56u/trunk
          if [ ! -f configs/templates/$BOARD.config ]; then
            echo "Error: Board config 'configs/templates/$BOARD.config' not found"
            exit 1
          fi
          cp -f configs/templates/$BOARD.config .config
          echo "Using board template: configs/templates/$BOARD.config"

          CONFIG_FILE="$GITHUB_WORKSPACE/repo/${PROFILE}_${KERNEL}"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Warning: Config file '$CONFIG_FILE' not found – skipping customisations"
            exit 0
          fi

          echo "Applying customisations from $CONFIG_FILE"
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'* ) continue ;;
            esac
            case "$line" in
              +*)
                option="${line#+}"
                sed -i "/^[[:space:]]*$option/d" .config
                echo "$option=y" >> .config
                echo "  + Enabled: $option"
                ;;
              -*)
                option="${line#-}"
                sed -i "/$option/d" .config
                echo "  - Removed: $option"
                ;;
              *)
                echo "Warning: Unknown directive '$line' – ignored"
                ;;
            esac
          done < "$CONFIG_FILE"
          echo "Customisation applied."

      - name: Build firmware
        run: |
          cd /opt/rt-n56u/trunk
          sudo ./clear_tree
          sudo ./build_firmware_modify $BOARD 0
          # Rename the firmware file to include only the profile suffix
          mkdir -p /opt/images/staging
          for f in images/*.trx; do
            base=$(basename "$f" .trx)
            mv "$f" "/opt/images/staging/${base}-${PROFILE}.trx"
          done
          echo "FIRMWARE_DIR=/opt/images/staging" >> $GITHUB_ENV

      - name: Upload firmware artifact (unique per matrix entry)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.kernel }}-${{ matrix.profile }}-${{ matrix.board }}
          path: ${{ env.FIRMWARE_DIR }}

  # ------------------------------------------------------------------
  # Release job: runs after all builds, downloads all artifacts, creates one release
  # ------------------------------------------------------------------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id && (github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_firmware

      - name: Organise files for release
        run: |
          mkdir -p release_files
          # Each artifact is in its own subfolder; copy all .trx files into release_files
          find all_firmware -name "*.trx" -exec cp {} release_files/ \;
          echo "FIRMWARE_DIR=$PWD/release_files" >> $GITHUB_ENV

      - name: Generate release tag and notes
        id: tag
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          cat > release.txt << EOF
          ## Padavan Unified Release $(date +"%Y.%m.%d-%H:%M")
          - Built with kernel(s): ${{ github.event.inputs.kernel || 'both' }}
          - Profile(s): ${{ github.event.inputs.profile || 'both' }}
          - Boards: ${{ github.event.inputs.boards || 'K2P MI-R3P' }}
          - Firmware files:
          EOF
          cd release_files
          for f in *.trx; do
            echo "- $f" >> ../release.txt
            echo "  - md5: $(md5sum "$f" | cut -d' ' -f1)" >> ../release.txt
          done
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload unified artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-all-firmware
          path: release_files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: release_files/*.trx
